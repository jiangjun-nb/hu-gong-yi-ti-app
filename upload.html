<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>传照片和视频</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f7f5f2; color: #2b2b2b; min-height: 100vh;
    padding: 24px 18px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 700; text-align: center; margin: 18px 0 6px; letter-spacing: 2px; }
  .sub { text-align: center; color: #8a857e; font-size: 14px; margin-bottom: 26px; line-height: 1.7; }
  .pick {
    display: block; width: 100%; border: 2px dashed #c9b8a3; border-radius: 18px;
    background: #fff; padding: 30px 16px; text-align: center; cursor: pointer;
  }
  .pick .big { font-size: 40px; line-height: 1; }
  .pick .t1 { font-size: 18px; font-weight: 600; margin-top: 12px; }
  .pick .t2 { font-size: 13px; color: #8a857e; margin-top: 6px; line-height: 1.7; }
  input[type=file] { display: none; }
  .count { text-align: center; font-size: 15px; font-weight: 600; margin-top: 14px; min-height: 20px; }
  .count small { display: block; font-weight: 400; color: #8a857e; font-size: 12px; margin-top: 3px; }
  .btn {
    display: block; width: 100%; margin-top: 14px; padding: 15px; font-size: 17px;
    font-weight: 600; color: #fff; background: #b08d57; border: none; border-radius: 14px;
    cursor: pointer;
  }
  .btn:disabled { background: #cbbfae; cursor: default; }
  .clear {
    display: block; width: 100%; margin-top: 10px; padding: 10px; font-size: 14px;
    color: #8a857e; background: transparent; border: none; cursor: pointer;
  }
  .status { margin-top: 16px; font-size: 14px; color: #6b655c; text-align: center; min-height: 20px; }
  .overall { height: 8px; background: #eee7dc; border-radius: 4px; margin-top: 10px; overflow: hidden; display: none; }
  .overall i { display: block; height: 100%; width: 0%; background: #b08d57; border-radius: 4px; transition: width .2s; }
  .list { margin-top: 14px; }
  .item {
    background: #fff; border-radius: 10px; padding: 9px 12px; margin-bottom: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; justify-content: space-between; gap: 10px;
  }
  .item .nm { font-size: 13px; font-weight: 600; word-break: break-all; flex: 1; }
  .item .st { font-size: 12px; color: #8a857e; white-space: nowrap; }
  .item .st.ok { color: #4c8a4c; font-weight: 600; }
  .item .st.err { color: #c0392b; font-weight: 600; }
  .item .st.run { color: #b08d57; font-weight: 600; }
  h2 { font-size: 16px; margin: 30px 0 10px; }
  .empty { font-size: 13px; color: #a39d94; text-align: center; padding: 12px 0; }
  .note { margin-top: 26px; font-size: 12px; color: #a39d94; line-height: 1.8; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>传照片和视频</h1>
  <p class="sub">选好照片和视频，点上传，传完我就收到了。<br>一次可以选 500 张。</p>

  <label class="pick" for="files">
    <div class="big">＋</div>
    <div class="t1">点这里选照片 / 视频</div>
    <div class="t2">照片和长视频都可以<br>一次选 500 张也没问题</div>
  </label>
  <input id="files" type="file" accept="image/*,video/*" multiple>

  <div class="count" id="count"></div>

  <button class="btn" id="upBtn" disabled>开始上传</button>
  <button class="clear" id="clearBtn" style="display:none">清空重选</button>
  <div class="status" id="status"></div>
  <div class="overall" id="overall"><i></i></div>

  <div class="list" id="queue"></div>

  <h2>已经传上来的</h2>
  <div class="list" id="done"><div class="empty">正在看服务器上有没有……</div></div>

  <p class="note">这个页面只用来传东西给你要的那个人，别转发给别人。<br>传完告诉他一声，他取走之后这里的东西会删掉。</p>
</div>

<script>
var RELAY = "https://hu-gong-yi-ti-relay-production.up.railway.app";
var TOKEN = "8f78273c54f3c4df53d2a0831290f964";
var MAX_FILES = 500;
var CONCURRENCY = 3;
var picked = [];
var upBtn = document.getElementById("upBtn");
var clearBtn = document.getElementById("clearBtn");
var statusEl = document.getElementById("status");
var countEl = document.getElementById("count");
var queueEl = document.getElementById("queue");
var doneEl = document.getElementById("done");
var overallEl = document.getElementById("overall");
var overallFill = overallEl.querySelector("i");
var fileInput = document.getElementById("files");

function fmt(n) {
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + " GB";
  if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
  if (n >= 1024) return (n / 1024).toFixed(0) + " KB";
  return n + " B";
}

function totalSize() {
  return picked.reduce(function (s, f) { return s + f.size; }, 0);
}

function updateCount() {
  if (!picked.length) {
    countEl.innerHTML = "";
    upBtn.disabled = true;
    clearBtn.style.display = "none";
    return;
  }
  countEl.innerHTML = "已选 " + picked.length + " / " + MAX_FILES + " 个，共 " + fmt(totalSize());
  upBtn.disabled = false;
  clearBtn.style.display = "block";
}

fileInput.addEventListener("change", function (e) {
  var fresh = Array.prototype.slice.call(e.target.files);
  e.target.value = "";
  if (!fresh.length) return;
  var added = 0;
  for (var i = 0; i < fresh.length; i++) {
    if (picked.length >= MAX_FILES) break;
    var f = fresh[i];
    var dup = picked.some(function (p) { return p.name === f.name && p.size === f.size && p.lastModified === f.lastModified; });
    if (dup) continue;
    picked.push(f);
    added++;
  }
  if (picked.length >= MAX_FILES && fresh.length > added) {
    statusEl.textContent = "已经满 500 个了，先传完这批再选下一批。";
  } else if (added === 0) {
    statusEl.textContent = "这些刚才已经选过了。";
  } else {
    statusEl.textContent = "已选 " + picked.length + " / " + MAX_FILES + " 个。";
  }
  renderQueue();
  updateCount();
});

clearBtn.addEventListener("click", function () {
  picked = [];
  renderQueue();
  updateCount();
  overallEl.style.display = "none";
  statusEl.textContent = "";
});

function renderQueue() {
  queueEl.innerHTML = "";
  picked.forEach(function (f, i) {
    var d = document.createElement("div");
    d.className = "item";
    d.id = "q" + i;
    var nm = document.createElement("div");
    nm.className = "nm";
    nm.textContent = f.name + " · " + fmt(f.size);
    var st = document.createElement("div");
    st.className = "st";
    st.textContent = "等待";
    d.appendChild(nm);
    d.appendChild(st);
    queueEl.appendChild(d);
  });
}

function setItem(i, text, cls) {
  var row = document.getElementById("q" + i);
  if (!row) return;
  var st = row.querySelector(".st");
  st.textContent = text;
  st.className = "st" + (cls ? " " + cls : "");
}

function uploadOne(file, i) {
  return new Promise(function (resolve) {
    setItem(i, "传中…", "run");
    var xhr = new XMLHttpRequest();
    xhr.open("POST", RELAY + "/api/up/" + TOKEN + "/upload?filename=" + encodeURIComponent(file.name), true);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");
    xhr.upload.onprogress = function (ev) {
      if (ev.lengthComputable) {
        setItem(i, "传中 " + Math.round(ev.loaded / ev.total * 100) + "%", "run");
      }
    };
    xhr.onload = function () {
      var ok = false;
      try { ok = JSON.parse(xhr.responseText).ok === true; } catch (e) {}
      if (xhr.status === 200 && ok) { setItem(i, "✓ 已传", "ok"); resolve(true); }
      else { setItem(i, "✗ 没传上", "err"); resolve(false); }
    };
    xhr.onerror = function () { setItem(i, "✗ 断了", "err"); resolve(false); };
    xhr.send(file);
  });
}

upBtn.addEventListener("click", async function () {
  if (!picked.length) return;
  upBtn.disabled = true;
  clearBtn.style.display = "none";
  fileInput.disabled = true;
  var total = picked.length;
  var done = 0;
  var failed = 0;
  overallEl.style.display = "block";
  overallFill.style.width = "0%";
  statusEl.textContent = "正在传 0 / " + total + " 个……";
  var next = 0;
  async function worker() {
    while (next < total) {
      var i = next++;
      var ok = await uploadOne(picked[i], i);
      if (ok) done++; else failed++;
      overallFill.style.width = Math.round((done + failed) / total * 100) + "%";
      statusEl.textContent = "正在传 " + (done + failed) + " / " + total + " 个……";
    }
  }
  var workers = [];
  for (var w = 0; w < Math.min(CONCURRENCY, total); w++) workers.push(worker());
  await Promise.all(workers);
  fileInput.disabled = false;
  upBtn.disabled = false;
  clearBtn.style.display = "block";
  statusEl.textContent = failed === 0
    ? ("全部传完了，" + done + " 个都收到了。")
    : ("传完了 " + done + " / " + total + " 个，" + failed + " 个没传上，可以重新选那几个再传。");
  refreshDone();
});

async function refreshDone() {
  try {
    var r = await fetch(RELAY + "/api/up/" + TOKEN + "/list");
    var j = await r.json();
    if (!j.ok) throw new Error("bad");
    if (!j.files.length) {
      doneEl.innerHTML = '<div class="empty">服务器上还没有文件</div>';
      return;
    }
    doneEl.innerHTML = "";
    j.files.forEach(function (f) {
      var d = document.createElement("div");
      d.className = "item";
      var nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = f.name.replace(/^\d{14}-[0-9a-f]{8}-/, "");
      var st = document.createElement("div");
      st.className = "st";
      st.textContent = fmt(f.size);
      d.appendChild(nm);
      d.appendChild(st);
      doneEl.appendChild(d);
    });
  } catch (e) {
    doneEl.innerHTML = '<div class="empty">暂时看不到服务器上的文件，传完再刷新看看</div>';
  }
}
refreshDone();
</script>
</body>
</html>
