    <title>湖工一体 App（公开版）</title>
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      :root {
        color-scheme: light dark;
        --bg: #f5f3ee; --surface: #fffdf8; --surface2: #edeae1; --text: #1c2733; --dim: #66727e;
        --border: #e0dbcd; --accent: #14406b; --accent-2: #2a6db0; --accent-soft: #dbe6f2; --on-accent: #ffffff;
        --hero-from: #123c66; --hero-to: #27679f; --danger: #c8402a; --danger-soft: #f9e3dd;
        --sage: #5f7a68; --sage-soft: #e2ead9; --amber: #a86f14; --amber-soft: #f6ead2;
        --radius: 16px; --card-shadow: 0 1px 3px rgba(28,39,51,.05), 0 6px 18px rgba(28,39,51,.05); --nav-h: 62px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1319; --surface: #171e28; --surface2: #202a37; --text: #eef2f6; --dim: #93a1af;
          --border: #2a3542; --accent: #82b4ec; --accent-2: #a8ccf2; --accent-soft: #1f3249; --on-accent: #0d2138;
          --hero-from: #1c3d63; --hero-to: #2f6699; --danger: #e0684f; --danger-soft: #3d231d;
          --sage: #93b89f; --sage-soft: #22331f; --amber: #e0aa4e; --amber-soft: #38301c;
          --card-shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.26);
        }
      }
      * { box-sizing: border-box; }
      html, body { background: var(--bg); overflow-x: clip; max-width: 100%; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif; font-size: 16px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px); }
      .page { display: none; } .page.active { display: block; }
      h1.page-title { font-size: 22px; margin: 4px 2px 12px; font-weight: 700; }
      h2.sec-title { font-size: 16px; margin: 20px 2px 10px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      h2.sec-title .more { font-size: 13px; color: var(--accent-2); font-weight: 500; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--card-shadow); padding: 14px; margin-bottom: 12px; }
      .hero { background: linear-gradient(135deg, var(--hero-from), var(--hero-to)); color: #fff; border: none; border-radius: 20px; padding: 18px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
      .hero .kicker { font-size: 13px; opacity: .85; } .hero .big { font-size: 21px; font-weight: 700; margin: 6px 0 2px; line-height: 1.35; }
      .hero .sub { font-size: 14px; opacity: .92; } .hero .meta { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
      .hero .chip { background: rgba(255,255,255,.16); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; }
      .muted { color: var(--dim); } .small { font-size: 13px; } .tiny { font-size: 12px; }
      .row { display: flex; align-items: center; gap: 10px; } .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .grow { flex: 1; min-width: 0; }
      .btn { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 12px; padding: 8px 14px; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 2.5rem; font-family: inherit; text-decoration: none; }
      .btn:active { transform: scale(.98); } .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
      .btn.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }
      .btn.danger-ghost { color: var(--danger); } .btn.block { width: 100%; } .btn:disabled { opacity: .55; cursor: default; }
      .btn.sm { min-height: 2.25rem; padding: 5px 11px; font-size: 13.5px; border-radius: 10px; }
      label.field { display: block; margin-bottom: 12px; } label.field > span { display: block; font-size: 13px; color: var(--dim); margin-bottom: 5px; }
      input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="time"], select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); color: var(--text); padding: 9px 12px; font-size: 16px; font-family: inherit; min-height: 2.75rem; }
      textarea { min-height: 5.5rem; resize: vertical; }
      input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-2); outline-offset: 0; border-color: transparent; }
      .alert { border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; line-height: 1.55; }

      { category: "关于湖工", title: "学校在哪儿：地址和四个校门", summary: "衡阳市衡花路 18 号；北门对衡州大道、东门对衡花路、南门对酃湖路", body: "湖南工学院在湖南省衡阳市，地址是衡花路 18 号。导航、寄快递、打车报地址，都用这个。\n\n四个校门的方向先记牢，找路、约人碰头都用得上：\n· 北门：出门对着衡州大道\n· 东门：出门对着衡花路，学校地址就在这条路上\n· 南门：出门对着酃湖路\n· 西边：紧挨着衡阳师范学院（东校区），两所学校是邻居，别走错门\n\n刚开学不熟路，进出校门时记一下自己走的哪个门、门外是哪条路，两三次就认全了。" },
      { category: "关于湖工", title: "校园地标：图书馆", summary: "毕业抛帽照就是在图书馆楼前拍的，认路先认它", body: "学校图书馆是校园里的标志性建筑——毕业季大家在楼前抛帽拍照，拍的就是这栋楼。在校园里找方向、跟人约地方碰头，先认图书馆，周围的教学楼、宿舍就好定位了。\n\n图书馆也是平时自习、借书的地方。具体的开放时间、借书规则和座位怎么约，以图书馆自己的公告为准。\n\n待补充：图书馆开放时间、借书册数和期限、自习座位预约方式——知道以后点这篇的编辑补进来。" },
      { category: "关于湖工", title: "校园里都有什么", summary: "宿舍、教学楼、食堂、体育馆、南区田径场，先有个整体印象", body: "校园里的基本配置：学生宿舍、教学楼、食堂、体育馆，还有南区田径场（体育课就在田径场上）。教学楼不止一栋，课表上的教室写法一般是楼号加房间号，或者像「数207」「社109」这样带简称的，上课前先在课表里看清是哪栋楼、哪间教室。\n\n开学第一周建议绕校园走一圈：宿舍到教学楼、到食堂、到田径场各要走多久，心里有数以后就不会上课迟到。\n\n待补充：各食堂的名字和位置、宿舍区分布、体育馆开放安排——摸清以后编辑这篇补进来。" },
      { category: "关于湖工", title: "常用系统速览：教务、智慧树、至评卓学", summary: "课表成绩看教务，网课在智慧树，高数作业在至评卓学", body: "在校几年要反复用的就这几个系统，先分清谁管什么：\n· 教务系统（jw.hnit.edu.cn）：课表、成绩、绩点、空闲教室都从这儿查，是最重要的一个\n· 智慧树（知到 App）：网课在这儿上，视频、章节测试、期末考试都在里面\n· 至评卓学（lazynut.net）：交高数作业的平台，作业在里面做、拍照上传、在线提交\n\n这几个系统在这个 App 里都接好了：课表打开就能看，成绩和空教室在「我的」里查，智慧树课程在「课堂」页，高数作业在「作业」页同步和做题，两个签到在首页。账号密码只存在你自己手机里，第一次用时按提示绑定一次就行。" },
      { category: "招生与入学", title: "报到前要准备什么", summary: "通用清单先备齐，具体以当年《入学须知》为准", body: "报到要带的东西每年大同小异，先按这份通用清单准备，最后以学校当年发的《入学须知》为准，别漏了须知里单独点名的材料：\n· 录取通知书、身份证（原件和复印件都备几份）\n· 高考档案 / 学籍档案（按生源地要求自带或邮寄，以须知为准）\n· 党团组织关系材料（团员证、入团志愿书等）\n· 一寸、两寸证件照各备一版，再存一份电子版在手机里\n· 户口迁移材料：只有打算迁户口的同学才需要，不迁不用办\n· 银行卡和少量现金：学费住宿费怎么交、交多少，以须知和学校缴费通知为准\n\n待补充：今年的缴费方式和金额、档案转递的具体要求——拿到《入学须知》后编辑这篇补进来。" },
      { category: "招生与入学", title: "报到当天流程", summary: "找学院报到点 → 交材料 → 安顿宿舍，大顺序不会错", body: "报到当天的流程各个学校都差不多，一般是这个顺序，现场有志愿者和指引牌，跟着走就行：\n1. 先找自己学院的报到点（按录取专业找），交材料、登记，领校园卡和宿舍安排\n2. 去宿舍放行李、铺床，看看缺什么生活用品\n3. 该交的费用按学校通知交，缴费成功的截图和凭证都存好\n4. 认识一下辅导员和同班同学，班级群、学院通知群该加的都加上\n5. 剩下的体检、军训、开学典礼安排，听学院通知，别自己猜时间\n\n待补充：报到点具体在哪、校园卡还要去哪激活——报到完编辑这篇，把实际走过的流程记下来。" },
      { category: "招生与入学", title: "军训提示", summary: "大一开学有军训，提前准备能少遭罪", body: "大一课程里有军训，一般在开学初。提前准备几样小东西，军训会好过很多：\n· 鞋垫：发的鞋底子硬，垫一副软鞋垫差别很大\n· 防晒：衡阳开学时太阳还很毒，脖子手臂别漏涂\n· 大水杯：训练间隙补水，别等渴透了再喝\n· 常用药：创可贴、防暑和肠胃的小药备一点\n\n身体不舒服要及时跟教官和辅导员说，别硬撑。军训的具体天数、时间和考核要求，以学校和学院当年的通知为准。" },
      { category: "校园生活", title: "吃饭：食堂怎么吃", summary: "学校有食堂，先挨个试一遍再固定下来", body: "学校里有食堂，一日三餐主要靠它。刚开学别急着固定一家：挨个食堂、挨个窗口试一遍，哪家合口味、哪家排队短、几点去人少，一两周就摸清了。\n\n待补充：食堂的名字、位置、营业时间和各自的招牌窗口——这篇留着，摸清一家补一家。" },
      { category: "校园生活", title: "宿舍生活", summary: "宿舍是住四年的地方，规矩先打听清", body: "入学后住学生宿舍。宿舍生活的通用经验：\n· 贵重物品和证件收好，离宿舍锁门\n· 大功率电器（热得快、电煮锅这类）一般宿舍都不让用，容易跳闸也危险，具体以宿舍管理规定为准\n· 和室友把值日、熄灯后安静时间这些事先说好，比事后闹矛盾强\n· 热水、洗衣、门禁这些每天都要用的，先问宿管或学长学姐怎么弄\n\n待补充：宿舍楼的名字和分布、门禁时间、热水供应时间、洗衣房位置——住下以后编辑这篇补进来。" },
      { category: "校园生活", title: "运动去哪儿", summary: "南区田径场跑步踢球，体育馆打室内项目", body: "想运动主要去两个地方：南区田径场和体育馆。田径场是露天的，跑步、踢球、体育课都在那儿（课表上体育课的地点写的就是南区田径场）；体育馆是室内的，篮球、羽毛球这类一般在里面。\n\n晚上田径场人最多，跑步散步都方便。体育馆的开放时间和场地要不要预约，以场馆门口的公告为准。\n\n待补充：体育馆开放时间、场地预约方式。" },
      { category: "人才培养", title: "上课时间：一天五大节", summary: "08:30 开始第一节，晚上 19:00–20:35 是最后一节", body: "学校的课按「大节」排，一天五大节，一大节两小节连上，时间是固定的：\n· 一大节 08:30–10:05\n· 二大节 10:25–12:00\n· 三大节 14:00–15:35\n· 四大节 15:55–17:30\n· 五大节 19:00–20:35\n\n课表上写的「01-02 节」就是一大节，以此类推。看课表时注意两件事：一是周次，很多课不是每周都上，有的只上某几周；二是同一门课不同星期可能换教室，别凭记忆走。这个 App 的课表页就是按这个时间和周次排的，打开就能看今天和整周的课。" },
      { category: "人才培养", title: "选课、查成绩和绩点", summary: "都在教务系统里办，App 的「我的」页能直接查成绩", body: "选课、查成绩、看绩点，都在教务系统里。每学期选课的时间窗口由教务处统一通知，窗口一开先把必修和想选的课占上，别拖到最后一天。\n\n成绩出来后在教务系统查：每门课有成绩和学分，平均绩点是全部课程按学分加权算出来的。这个 App「我的」页有「查询成绩」入口，走的就是教务系统的成绩接口，平均绩点、总学分、每门课的成绩一次看全，不用再去网页里翻。\n\n待补充：本学期的选课时间窗口、重修补修的报名办法——教务处发了通知就编辑这篇补上日期。" },
      { category: "人才培养", title: "网课（智慧树）怎么学", summary: "视频看完不等于满分：还有章节测试、平时分和期末考试", body: "智慧树（知到）的网课，成绩一般由几块拼起来，别以为把视频刷完就完事：\n· 视频：要完整看完才记进度，快进、倍速太猛可能不记，自己留意进度数字有没有涨\n· 章节测试：每章后面的小测，算分，别漏\n· 平时分：包含「学习习惯」——看的是规律学习的天数，临考前突击刷完，天数不够这块分照样低；还有互动分，在课程里提问、回答能攒\n· 期末考试：有固定的考试时间窗，过期不补\n\n这个 App「课堂」页能看每门网课的进度和提醒；看视频从课堂页点进浏览器打开学习页，登录一次浏览器就记住了。" },
      { category: "人才培养", title: "找空教室自习", summary: "教务系统能查哪间教室哪节没课，App 里有现成入口", body: "想找个没人的教室自习，不用一间间去碰运气：教务系统能按日期和节次查空闲教室，哪栋楼、几层、多少座位都列得清清楚楚。\n\n这个 App「我的」页有「找空教室」入口，选好日期和节次就查。查到空教室只是说明那节没排课，临时被借用开会也是有的，去了有人就换一间。" },
      { category: "社区", title: "社团和学生组织", summary: "开学招新季多去看看，别急着报一堆", body: "开学后会有社团招新，摊位一般摆在人流大的路上。选社团的通用经验：\n· 先逛一圈再决定，一口气报三四个，最后哪个都顾不上\n· 优先选真感兴趣、能坚持去的，一个待满一年比三个都退强\n· 问清楚活动频率和要不要交费，交费的先想想再交\n· 学生会、学院组织招新时间和社团不完全一样，留意学院通知\n\n待补充：学校有哪些口碑好的社团、招新时间和地点——招新季过了编辑这篇补进来。" },
      { category: "社区", title: "有事找谁", summary: "先找辅导员，是大多数问题的第一站", body: "在学校遇到事，不知道找谁时，按这个顺序来：\n· 学习、请假、生活上的事先找辅导员，这是大多数问题的第一站，联系方式开学时学院会发\n· 课表、成绩、选课的技术问题，看教务系统里的通知，或去教务处问\n· 宿舍维修、门禁这类事，先找宿管登记\n· 拿不准归谁管的，先问辅导员，他会告诉你去哪儿办\n\n待补充：辅导员办公室在哪、教务处和各部门的办公地点电话——打听到了编辑这篇补进来，别凭记忆写，没核实的不要写。" },
      { category: "社区", title: "这本 WIKI 怎么用", summary: "能搜、能改：你知道的比这里多，就补进来", body: "这本 WIKI 是这个 App 里置的新生攻略，按关于湖工、招生与入学、校园生活、人才培养、社区五类放。\n\n用法：\n· 找内容：点开任意一篇看全文；想不起在哪一篇，用顶上的搜索框搜关键词，标题和正文都能搜到\n· 补充和纠错：每一篇都能编辑——点开文章，点「编辑」就能改标题、简介和正文，改完保存就生效；发现哪写得不对，直接改\n· 写新篇：列表页有「写一篇攻略」，选个分类就能加，食堂测评、宿舍攻略这种越具体越有用\n\n这里的内容只写核实过的：不确定的宁可写「待补充」留空，也不要编。后面用的人，靠的就是这一条。" }
